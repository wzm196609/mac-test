name: 交互式进入 macOS

on:
  workflow_dispatch:   # 手动触发

jobs:
  shell:
    runs-on: macos-latest
    timeout-minutes: 360   # 最长 6 小时
    steps:
      - name: 查看环境
        run: |
          sw_vers
          uname -a
          echo "=== macOS 环境已就绪，等待你连接 ==="

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        with:
          wait-timeout-minutes: 60   # 若 60 分钟内无人连接则自动关闭
